name: Deccan Origin Monorepo CI/CD

on:
  push:
    branches: [ main, dev, staging ]
  pull_request:
    branches: [ main, dev, staging ]

jobs:
  backend-checks:
    name: Backend Lint, Security & E2E Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd Backend
          npm ci

      - name: Run Backend Integration & Implementation Tests
        run: |
          cd Backend
          npm test
          node tests/api.test.js
          node tests/fullStackIntegration.test.js
          node tests/implementationGuide.test.js

  frontend-android-checks:
    name: Frontend & Android Expo Build Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Validate Expo Configuration & Android Manifest
        run: |
          cd Frontend
          npx expo config

      - name: Validate Expo Router & Web Bundle Export
        run: |
          cd Frontend
          npx expo export -p web

