version: '3.8'

services:
  deccanorigin-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deccanorigin-api-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - POSTGRES_URL=postgresql://deccanorigin:secure_eco_pass_2026@postgres:5432/deccanorigin_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=eco_swadesh_production_jwt_secret_2026_secure
    depends_on:
      - postgres
      - redis
    networks:
      - deccanorigin-network

  postgres:
    image: postgres:16-alpine
    container_name: deccanorigin-postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=deccanorigin
      - POSTGRES_PASSWORD=secure_eco_pass_2026
      - POSTGRES_DB=deccanorigin_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - deccanorigin-network

  redis:
    image: redis:7-alpine
    container_name: deccanorigin-redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - deccanorigin-network

networks:
  deccanorigin-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
